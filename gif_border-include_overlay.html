<html>
<title>Twitch Gif-Overlay Bot by RonXTCdaBass</title>
<head>
	<script src="https://code.jquery.com/jquery-3.6.4.min.js" integrity="sha256-oP6HI9z1XaZNBrJURtCoUT5SUnxFr8s3BzRl+cbzUq8=" crossorigin="anonymous"></script>
	<script src="https://github.com/tmijs/tmi.js/releases/download/v1.8.5/tmi.min.js"></script>
	<style>
		/* if using as a OBS browser source, best set background: transparent; */
		body {
			background-color: transparent;
			/*background: radial-gradient(circle, rgba(0,222,229,1) 0%, rgba(106,0,176,1) 100%);*/
			background-size: contain;
			background-position: center;
			background-repeat: no-repeat;
			overflow: hidden;
			margin: 0;
			padding: 0;
		}

		#gif_div {
			background-size: contain,contain; /* auto,contain; */
			background-position: center;
			background-repeat: no-repeat,no-repeat;
			overflow: hidden;
			margin: 0;
			margin-top: 5vh;
			padding: 0;
			width: 100vw;
			height: 90vh;
		}
	</style>
</head>
<body>

	<div id="gif_div"></div>

<!--/////////////////////////////////////////////////////////////////	
<// Configuration - Settings -instructions
<//
<// If the file is only to be used locally in OBS for a single fixed channel, 
<// please comment out the following paragraph between <-start ... & end-> tag and 
<// simply swap the two lines beginning with "let twitchChannel = ..." and 
<// enter the twitch channel. 
<////////////////////////////////////////////////////////////////////-->

<script>
//<!--START---GET-CHANNEL-FROM-ADRESSFIELD--->
 function getUrlParameter(name) {
    name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
    let regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
    let results = regex.exec(location.search);
    return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
	}
//<!---GET-CHANNEL-FROM-ADRESSFIELD---END-->

 let twitchChannel = getUrlParameter('channel').toLowerCase().trim();
//let twitchChannel = "YOURCHANNEL"; 		// enter your channel for work

		let twitchChatCommand = "!gif";
		let defaultImage = "";
		let borderImage = ""; 		// "usercontent_border_2.png";
		let PAUSE_DURATION = 3 * 1000; // 5 Sekunden Pause zwischen den gifs
		let DISPLAY_DURATION = 12 * 1000; // 15 Sekunden zum Anzeigen jeden gifs

		if (!defaultImage) {
			defaultImage = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
		}

		$('#gif_div').css('background-image', 'url(' + defaultImage + ')');

		function doGif(ImageOriginalURL) {

			// replace image source with the image from the user
			$('#gif_div').css('background-image', 'url(' + borderImage + '), url(' + ImageOriginalURL + ')');
			$('#gif_div').addClass('active');

			// Set a timeout to handle the display duration
			setTimeout(() => {
				$('#gif_div').removeClass('active');

			// go back to defaultImage when gif is done playing
				$('#gif_div').css('background-image', 'url(' + defaultImage + ')');
				}, DISPLAY_DURATION);
			}

		// Queue class to manage gif playback
		function Queue(options) {
		let queue = [];
		let isLooping = false;
		let isPaused = false;

		this.loop = async () => {
		isLooping = true;
		while (queue.length > 0 && !isPaused) {
		const item = queue.shift(); // remove the item from the queue
		await item(); // execute the item
		await new Promise(resolve => setTimeout(resolve, PAUSE_DURATION)); // Pause before the next gif
		}
		isLooping = false; // Mark as not looping
		};

			this.add = (item) => {
			if (isPaused) return;
			queue.push(options.onAdd ? options.onAdd(item) : item);
			if (!isLooping) this.loop(); // Start the loop if not already running
			};

		this.clear = () => {
		queue = [];
		};

			this.pause = (duration = 0) => {
					isPaused = true;
					setTimeout(() => (isPaused = false), duration);
					};

					this.isLooping = isLooping;
					}

		// Instantiate the queue for gif commands
		const gifQueue = new Queue({
			onAdd: (imageURL) => () => {
			doGif(imageURL.trim());
			return new Promise(resolve => setTimeout(resolve, DISPLAY_DURATION));
			}
		});

		// TMIjs Twitch chat connection
		const client = new tmi.Client({
				channels: [twitchChannel]
			});

			client.connect().catch(console.error);

			// Triggers on message
				client.on('chat', (channel, user, message, self) => {
			// Do nothing if message does not start with twitchChatCommand
				if (self || !message.startsWith(twitchChatCommand)) return;

			// grabs the first word from the message
			//let commandOption = message.split(' ')[0];

			// grabs all words/text that comes after the commandOption
			let ImageOriginalURL = message.slice(message.indexOf(twitchChatCommand) + twitchChatCommand.length);
			// Check if there's a valid gif URL
				if (ImageOriginalURL.trim() !== '') {
			// Add the gif command to the queue
				gifQueue.add(ImageOriginalURL);
				// client.say("danke für dein Bild! in 1min darf das nächste!");
			}

		});
